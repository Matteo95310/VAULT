<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <header class="main-padding">
        <!-- Left part -->
        <div class="left">
            <div class="logo">
                <img src="assets/images/Logo Vault.jpg" alt="Logo" />
                <span>VAULT</span>
            </div>            
            <nav>
                <ul>
                    <li>
                        <a class="active" href="#">Catalogue</a>
                    </li>
                    <li>
                        <a class="profile" href="#">Mon profil</a>
                    </li>
                    <li>
                        <a class="admin" href="#">Administration</a>
                    </li>
                </ul>
            </nav>
        </div>

        <!-- Right part -->
        <div class="right">
            <div class="search_bar">
                <input type="image" src="assets/images/mag_glass.svg" alt="Loupe">
                <input type="search" placeholder="Rechercher film, série, jeu...">
                <span class="shortcut">CTRL+K</span>
            </div>
            <div class="exp_lvl">
                <img src="assets/images/EXP bar.svg" alt="compteur d'expérience">
                <a id="level" href="#">2</a>
                <span>
                    •
                </span>

                <a id="xp" href="#">135</a>
            </div>

            <div class="profile">
                <img src="assets/images/Profile_pic.jpg" alt="compteur d'expérience">
                <a href="#">Par</a>
            </div>

        </div>
    </header>

    <div class="main-padding">
        <h1>Explorez votre univers pop-culture</h1>
    </div>

    <footer class="main-padding">
            <div class="left">
                <div class="footer_title">
                    <span class="logo">VAULT</span>
                    <span>// Plateforme Pop-Culture</span>
                    <span>Projet Web Bac+1 - 4 Sprints - Architecture native HTML/CSS/PHP/JS</span>
                </div>
            </div>
            <div class="right">
                <nav>
                    <ul>
                        <li>
                            <a href="#">Catalogue</a>
                        </li>
                        <li>
                            <a href="#">Progression</a>
                        </li>
                        <li>
                            <a href="#">Audit & Sprints</a>
                        </li>
                    </ul>
                </nav>
                <div>
                    <span>v1.4.0-stable</span>
                </div>
            </div>
            
    </footer>
</body>
</html>
